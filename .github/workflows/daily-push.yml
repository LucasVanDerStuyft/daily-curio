name: Daily curio push

on:
  schedule:
    # 07:00 UTC = 09:00 Belgian summer time / 08:00 winter time. GitHub may run it a bit late.
    - cron: '0 7 * * *'
  workflow_dispatch: {}

permissions:
  actions: write   # for the keep-alive step below
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - run: node push/send.mjs
        env:
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Re-enabling the workflow via the API keeps it alive.
      - name: Keep schedule alive
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-push.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
